# AUDIT PROBE A-1b - evidence only, this branch is not for merge.
#
# Pre-validates the API the A-1 remedy would depend on, and measures the
# real filter inventory on this host. Writing the remedy against an
# assumed API is debt V1's failure mode.
#
# geoMap v2.0 | 21-Aug-2026 | Claude Opus 5 (Anthropic)
name: audit-probes
on:
  push:
    branches: ['claude/audit-probes-a1-*']
  workflow_dispatch:
jobs:
  probe:
    name: A-1b filter inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        timeout-minutes: 8
        with:
          release: R2026a
          cache: true
      - name: Probe A-1b
        uses: matlab-actions/run-command@v3
        with:
          command: |
            addpath(pwd); geoMapSetup;
            run('records/audit/probe_A1b_filter_reasons.m');

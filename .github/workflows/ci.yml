# GeoMapper CI.
#
# Licensing:
#   public repo  - nothing to do: setup-matlab licenses base MATLAB
#                  automatically on GitHub-hosted runners
#   private repo - request a MATLAB batch licensing token and store it as
#                  the secret MLM_LICENSE_TOKEN
#   self-hosted  - change runs-on; no token needed
#
# Structure follows the shAnalysis CI (v2.6.0), which is proven in
# service: static gates before runtime provisioning, a tight cap on the
# MATLAB setup step, and repo-layout assertions before the suite so a
# wrong working directory fails loudly instead of running nothing.
#
# geoMap v2.0 | 14-Aug-2026 | Claude Opus 5 (Anthropic)

name: gates

# PUSH ON main PLUS pull_request, and NOT push on every branch.
#
# The previous block ran both triggers on every branch and defended the
# duplicate as an instrument: a twin run whose step durations could be
# compared when a runner hung. WORKFLOW_GUIDE Part 4 forbids exactly
# that pairing, and the defence does not survive being costed. The twin
# is a permanent doubling of every job on every push - roughly 2x the
# runner minutes and 2x the queue depth for the whole life of the
# project - bought to make one rare diagnosis marginally easier, and
# that diagnosis has a cheaper instrument already in the file: the
# step-level timeout on the MATLAB setup step, which turns a hang into
# a named failure in eight minutes without any comparison at all.
#
# What is NOT lost: a branch with an open pull request still gets a run
# on every push, because pull_request fires on synchronize. What is
# lost is the run on a branch nobody has opened a PR for - which is the
# run WORKFLOW_GUIDE Part 5 says should not exist, since the draft PR
# is what buys the verdict.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on the same ref, but never on main: a cancelled
  # main run loses the baseline durations the twin comparison needs.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:

  # ------------------------------------------------------------------
  # STATIC GATES FIRST. No language runtime, so a structural or
  # documentation defect fails in seconds instead of after minutes of
  # environment provisioning.
  # ------------------------------------------------------------------
  static:
    name: static gates (no runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Structural check of all MATLAB sources
        # mcheck refuses to report a clean tree unless its own
        # fault-injection self-test passes in the same invocation.
        run: python3 tools/mcheck.py .

      - name: Provenance and honesty audit
        run: python3 tools/provenance_audit.py .

      - name: Oracle register vs the tree that cites it
        # V12: every other gate reads code, provenance or the stage
        # ledger. None read Part 3, and FOUR of its twelve rows were wrong
        # across a released version - two marked open while the modules
        # filling them ran on every push, one naming an oracle that cannot
        # certify its own claim, and one cited by two frozen acceptance
        # criteria. An empty row is read as a known gap; a wrong row reads
        # identically and is not one.
        run: python3 tools/oracle_sync.py .

      - name: Ledger sync (handover status vs records evidence)
        # PV-130: every other gate in this project looks at code, so a
        # handover whose ledger had stopped matching four days of merged
        # work was invisible to all of them. Runtime-free and in the first
        # job on purpose - documents drift hardest in the sessions where
        # MATLAB is not reachable, which are exactly the sessions that
        # never reach the MATLAB job.
        run: python3 tools/ledger_sync.py .

  # ------------------------------------------------------------------
  # The mirror, and the frozen numerical criteria.
  # ------------------------------------------------------------------
  mirror:
    name: mirror + frozen acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the GDAL command-line utilities
        # Oracles O7 and O8. The runner has root, so CI takes the CLI
        # route; the authoring sandbox has no root and reaches the same C
        # entry points through the libgdal bundled in the rasterio wheel.
        # Which route ran is RECORDED with every measurement, so the two
        # are compared rather than assumed equivalent (mirror limit L12).
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin

      - name: Install mirror dependencies
        run: python3 -m pip install --upgrade pip -r mirror/requirements.txt

      - name: Record the oracle version
        # A measurement without its oracle version is not reproducible.
        run: |
          python3 -c "import pyproj, numpy, scipy; \
            print('pyproj', pyproj.__version__, '| PROJ', pyproj.proj_version_str); \
            print('numpy', numpy.__version__, '| scipy', scipy.__version__)"
          gdalinfo --version

      - name: Prove the GDAL route before anything cites it
        # An oracle wired up wrongly agrees with nothing and looks like a
        # defect in the code under test. This asserts the route reproduces
        # the slope and aspect of an analytically known plane FIRST.
        working-directory: mirror
        run: python3 -m geomap_mirror.gdal_oracle

      - name: Run the mirror
        working-directory: mirror
        run: python3 -m geomap_mirror.references

      - name: The committed reference is what the mirror computes
        # A-2: the MATLAB reference tier asserts against the COMMITTED
        # reference_values.json while this job regenerates it and uploads
        # it as an artefact - the two never met, and the two already
        # disagreed in a green tree (PV-132). The mirror step above has
        # just overwritten the working-tree copy, so this compares it
        # against the committed blob. Unregistered drift is red;
        # mirror/DRIFT.md says which values may move and by how much.
        working-directory: mirror
        run: python3 check_reference_sync.py

      - name: Frozen acceptance criteria
        # The scientific instrument: a numerical criterion that can reject
        # a wrong algorithm before any human reads the diff. Fails on a
        # missing fixture (exit 2) as loudly as on a breach (exit 1) -
        # a run that cannot find its fixture must never pass quietly.
        working-directory: mirror
        run: python3 check_acceptance.py

      - name: Upload measured values
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-reference-values
          path: mirror/geomap_mirror/out/reference_values.json

  # ------------------------------------------------------------------
  # MATLAB. Public project, so setup-matlab licenses the products with
  # no token. Runs only after the static gates pass.
  # ------------------------------------------------------------------
  matlab:
    name: MATLAB suite
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        # Explicit step-level timeout. The nominal duration of this step is
        # a couple of minutes; the pathological case runs five to ten and
        # looks like a slow success while it burns the queue.
        # 8 minutes, not a round guess: in the shAnalysis project this step
        # hung four times in one session, running 5-10 minutes against a
        # nominal 1.2. A tight cap makes a retry cost eight minutes instead
        # of the whole job budget.
        timeout-minutes: 8
        with:
          # Pin the release the toolbox targets. If this release is not yet
          # offered by the action, that is the FIRST thing to check when
          # this step fails - not the test code.
          release: R2026a
          cache: true

      - name: Run the gates
        uses: matlab-actions/run-command@v3
        with:
          # xvfb is provided by the action's display handling; every suite
          # creates figures with 'Visible','off' regardless, so nothing
          # here depends on a display being present.
          #
          # The manifest is regenerated and then verified. Under CI this
          # exercises the manifest code path rather than relying on it:
          # git's content addressing is the transfer integrity mechanism
          # here. The manifest exists for the Tier-B chat handoff, where
          # there is no git.
          command: |
            fprintf('pwd: %s\n', pwd);
            assert(isfolder('tests'), 'repo layout: tests missing in %s', pwd);
            assert(isfolder('tools'), 'repo layout: tools missing in %s', pwd);
            n = numel(dir(fullfile('tests','*.m')));
            fprintf('files in tests: %d\n', n);
            assert(n >= 6, 'repo layout: only %d files in tests', n);
            addpath(pwd); geoMapSetup;
            % The audit first, with its own self-test on: it is the only
            % gate here that proves every one of its checks against a
            % planted defect before reporting anything. A red audit then
            % costs seconds instead of a full suite run.
            assert(geoMapAudit(), 'geo:ci:AuditFailed', ...
                'The static audit reported findings. See the table above.');
            makeManifest;
            ok = rungeoMapTests("all");
            assert(ok, 'geo:ci:GateFailed', ...
                ['The green gate is not the pass count. Read the log: ' ...
                 'manifest, files loaded, warning inventory, speed ' ...
                 'budgets and category coverage each gate independently.']);

      - name: Upload MATLAB logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-logs
          path: |
            *.log
            test-results/
          if-no-files-found: ignore
